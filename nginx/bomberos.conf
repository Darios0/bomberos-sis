server {
    listen 80;
    server_name _;

    # ── Access Control ─────────────────────────────────────────────────────
    # Allow local networks only. Adjust for your environment:
    # - 192.168.0.0/16 (Class B private network)
    # - 10.0.0.0/8 (Class A private network)
    # - 127.0.0.1 (localhost)
    # - 172.16.0.0/12 (Class C private network, Docker default)
    
    #allow 192.168.0.0/16;
    #allow 10.0.0.0/8;
    #allow 172.16.0.0/12;
    #allow 127.0.0.1;
    #deny all;

    # ── Frontend (React/Vite built files) ──────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API Proxy to Node.js Backend ───────────────────────────────────────
    location /api {
        proxy_pass http://bomberos_server:3001;

        proxy_http_version 1.1;
        
        # Headers for proper client identification
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $server_name;
        
        # WebSocket support (if needed in future)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        
        # Timeouts: Puppeteer PDF generation can be slow
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Request body size (for file uploads if added)
        client_max_body_size 10M;
    }

    # ── Health Check Endpoint ──────────────────────────────────────────────
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # ── Static Assets Cache ────────────────────────────────────────────────
    # Cache busting: Vite adds hashes to filenames, safe to cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # ── Disable caching for HTML (to always get latest SPA) ────────────────
    location ~* \.html$ {
        expires 0;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── Security Headers ───────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy (relaxed for Material-UI)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/bomberos-access.log combined;
    error_log  /var/log/nginx/bomberos-error.log warn;

    # ── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_min_length 1000;
    gzip_disable "msie6";
}
